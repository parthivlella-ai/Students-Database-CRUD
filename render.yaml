# Render Blueprint Specification for Students Database CRUD Application
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: students-database-crud
    env: python
    region: oregon
    plan: free
    healthCheckPath: /health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./data/students.db
      - key: ALLOWED_ORIGINS
        value: "*"
      # Optional: set to custom Ollama URL if running a hosted Ollama instance
      # - key: OLLAMA_BASE_URL
      #   value: http://localhost:11434

    # NOTE ON PERSISTENT STORAGE:
    # On Render Free Tier, filesystem storage is ephemeral (resets on service sleep/restart).
    # To enable permanent data persistence across restarts on Render (Starter plan or higher):
    # Uncomment the disk configuration below and update DATABASE_URL to sqlite:////var/data/students.db:
    # disk:
    #   name: students-data
    #   mountPath: /var/data
    #   sizeGB: 1
